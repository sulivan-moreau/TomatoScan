[project]
name = "tomatoscan"
version = "0.1.0"
description = "Détection de maladies sur tomates par CNN (MobileNetV2)"
requires-python = ">=3.11,<3.14"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    # ML — tensorflow-macos/metal sont macOS uniquement ; torch gère l'inférence en prod/CI
    "tensorflow-macos>=2.16.1; sys_platform == 'darwin'",
    "tensorflow-metal>=1.1.0; sys_platform == 'darwin'",
    "numpy>=1.26.4",
    "pillow>=10.3.0",
    "scikit-learn>=1.4.2",
    "matplotlib>=3.8.0",
    # App
    "streamlit>=1.36.0",
    "requests>=2.31.0",
    "pyjwt>=2.8.0",
    # Data
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.0",
    # Logs
    "loguru>=0.7.2",
    # Monitoring
    "prometheus-client>=0.20.0",
    # Dataset
    "kaggle>=1.6.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    # Pilote SQLite asynchrone — utilisé uniquement par la suite de tests (rapide,
    # aucun service externe requis en CI) ; l'app elle-même cible asyncpg/PostgreSQL
    # en développement/préprod/prod, vérifié séparément contre un vrai PostgreSQL.
    "aiosqlite>=0.20.0",
]

[tool.uv]
constraint-dependencies = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest<9",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un seul event loop pour toute la session de tests : le moteur de test (StaticPool,
# une connexion SQLite en mémoire partagée par tous les tests) doit rester sur la
# même boucle asyncio du début à la fin, sinon aiosqlite lève "attached to a
# different loop" dès le deuxième test.
# asyncio_default_fixture_loop_scope règle la portée des fixtures async (client,
# _preparer_bdd_test), mais pas celle des fonctions de test elles-mêmes — sans
# asyncio_default_test_loop_scope, ces dernières restent sur une boucle "function"
# différente de la boucle "session" des fixtures. aiosqlite tolère ce décalage,
# asyncpg non ("attached to a different loop" dès qu'une route utilise une
# connexion DB ouverte sur la boucle session depuis une coroutine de test sur une
# boucle function) : les deux portées doivent donc être alignées sur "session".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

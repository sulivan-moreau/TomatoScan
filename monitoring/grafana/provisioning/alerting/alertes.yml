# Provisioning des règles d'alerte Grafana Unified Alerting
# Déclenche une alerte si le taux d'erreurs /predict dépasse 0.1 req/s sur 5 minutes.

apiVersion: 1

groups:
  - orgId: 1
    name: TomatoScan
    folder: TomatoScan
    # Évaluation toutes les minutes
    interval: 1m
    rules:
      - uid: tomatoscan-error-rate
        title: "Taux d'erreurs TomatoScan élevé"
        # Condition C = seuil sur B (valeur réduite de A), pas directement sur A :
        # une requête Prometheus sur une plage de temps (relativeTimeRange 300-0)
        # renvoie une série temporelle, pas une valeur unique — le seuil (refId C)
        # exige une donnée "réduite" à un seul point, d'où l'étape B ci-dessous.
        # Bug réel trouvé et corrigé après un test en conditions réelles (trafic
        # d'erreurs simulé) : sans l'étape B, l'évaluation échouait systématiquement
        # avec "invalid format of evaluation results... only reduced data can be
        # alerted on" — la règle restait bloquée en erreur, jamais déclenchée.
        condition: C
        data:
          # Requête A — taux d'erreurs sur 5 minutes
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "sum(rate(tomatoscan_errors_total[5m]))"
              refId: A
          # Étape B — réduit la série temporelle de A à sa dernière valeur
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          # Condition C — seuil > 0.1 req/s, appliqué à la valeur réduite B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.1
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
        # L'alerte se déclenche après 1 minute de dépassement continu
        for: 1m
        annotations:
          summary: "Taux d'erreurs TomatoScan > 0.1 req/s depuis 1 minute"
          description: "Vérifier les logs de l'API FastAPI et l'état du modèle MobileNetV2."
        labels:
          severity: warning
        noDataState: NoData
        execErrState: Error

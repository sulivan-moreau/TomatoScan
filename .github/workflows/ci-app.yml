# Workflow CI/CD TomatoScan — valide le code, puis (sur push develop/main) livre les
# images applicatives sur GitHub Container Registry (ghcr.io).
#
# Deux jobs :
#   - test      : tests + lint + build Docker de validation (sur chaque push ET PR)
#   - livraison : build + push des images API/frontend vers ghcr.io, taguées par le SHA
#                 du commit. Ne s'exécute QUE si le job "test" est vert (needs: test) et
#                 UNIQUEMENT sur push develop/main (jamais sur une PR). C'est l'étape de
#                 livraison applicative conditionnée au succès des tests (compétence C19).
#
# Architecture de déploiement :
#   push sur develop → Coolify déclenche le déploiement preprod
#                       (PostgreSQL async, docker-compose.override.yml sur VPS OVH)
#   push sur main    → Coolify déclenche le déploiement prod
#                       (PostgreSQL, docker-compose.yml sur VPS OVH)
#
# Coolify reste la cible de déploiement finale sur le VPS (il build ses propres images
# à partir du code source). Les images poussées sur ghcr.io par le job "livraison" sont
# des artefacts de livraison versionnés par SHA — traçables, testés — voir
# docs/cd_application.md pour le détail du flux et la recommandation de protection de
# branche (exiger le job "test" vert avant merge, ce qui garantit que seul du code testé
# atteint develop/main, donc Coolify).
#
# PostgreSQL étant désormais le seul moteur de l'application (create_async_engine +
# asyncpg, plus de SQLite en dehors des tests locaux rapides), la CI démarre un vrai
# service PostgreSQL (voir "services:" ci-dessous) plutôt qu'un substitut SQLite —
# un DATABASE_URL sqlite:// (driver sync) ferait planter create_async_engine().
#
# Modèle MobileNetV2 (.pt) :
#   Stocké dans un volume Docker persistant sur le VPS — absent de ce dépôt (trop volumineux).
#   En cas de réentraînement, le nouveau .pt remplace l'ancien dans le volume
#   via un script de déploiement SSH (copie directe sur le VPS, hors CI).
#
# Les tests mockent model_service.predire → le .pt n'est pas requis pendant la CI.

name: CI/CD — Application

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Tests & Lint (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Service PostgreSQL réel — PostgreSQL étant le seul moteur ciblé par l'application
    # (create_async_engine/asyncpg), la CI teste contre une vraie instance plutôt qu'un
    # substitut SQLite. GitHub Actions attend que le healthcheck pg_isready passe avant
    # de démarrer les steps ci-dessous.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tomatoscan_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tomatoscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Secrets configurés dans GitHub → Settings → Secrets and variables → Actions
      # (voir section "Secrets à configurer" en bas de ce fichier)
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # PostgreSQL réel (service ci-dessus) — moteur async (asyncpg), cohérent avec
      # create_async_engine() dans database/connexion.py. localhost:5432 : le service
      # est exposé sur l'hôte du runner via "ports", pas seulement sur le réseau interne
      # des containers.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/tomatoscan_test

      # Le modèle .pt est absent du dépôt : les tests mockent model_service
      # via unittest.mock.patch → aucun checkpoint réel n'est nécessaire en CI
      MODEL_PATH: ./models/non_existant.pt

      # Fichier CSV de rapport — les tests qui en ont besoin utilisent tmp_path
      REPORTS_PATH: models/historique_test.csv

      # Signale à l'application qu'elle s'exécute dans un environnement de test
      APP_ENV: test

    steps:
      # Étape 1 — Récupération du code source (branche ou PR)
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 — Installation de Python 3.11 (version cible du projet)
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Étape 3 — Installation de uv (gestionnaire de dépendances et d'environnements)
      # enable-cache met en cache le dossier uv pour éviter de re-télécharger les packages
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Étape 4 — Installation des dépendances projet + groupe dev (pytest, ruff, pytest-cov)
      # uv lit uv.lock pour des versions reproductibles entre local et CI
      - name: Installation des dépendances
        run: uv sync --extra dev

      # Étape 4bis — Audit des dépendances installées contre la base de vulnérabilités connues
      # (OSV/PyPI Advisory). Scanne l'environnement réellement installé (-l/--local), pas une
      # ré-résolution à part — cohérent avec les versions verrouillées par uv.lock.
      # Si une vulnérabilité sans correctif disponible apparaît un jour, l'ignorer explicitement
      # ici avec --ignore-vuln <ID> et un commentaire justifiant pourquoi (ex. package non
      # utilisé sur le chemin vulnérable, ou fix indisponible pour la version Python cible) —
      # plutôt que de faire échouer la CI indéfiniment sur un correctif hors de notre contrôle.
      # Aucune vulnérabilité sans fix n'est ignorée actuellement : aucune trouvée à ce jour.
      - name: Audit de sécurité des dépendances (pip-audit)
        run: uv run --with pip-audit pip-audit -l

      # Étape 5 — Vérification du style et des erreurs statiques avec ruff.
      # Couvre src/ ET tests/ : le code de test est aussi du code à maintenir propre,
      # et c'est le périmètre annoncé dans les rapports du projet.
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      # Étape 6 — Vérification du formatage avec ruff (bloque les PR mal formatées),
      # même périmètre que le lint ci-dessus (src/ + tests/).
      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      # Étape 6ter — Filet de sécurité : s'assure que la base tomatoscan_test existe
      # avant alembic. POSTGRES_DB (service ci-dessus) doit normalement suffire, mais
      # l'image postgres officielle redémarre en interne après ses scripts d'init
      # (initdb → serveur temporaire → arrêt → serveur définitif) ; pg_isready peut
      # répondre "healthy" pendant cette fenêtre, avant que POSTGRES_DB ait fini d'être
      # créée — flakiness connue des services PostgreSQL sous GitHub Actions. Le "|| true"
      # évite un échec si la base existe déjà (cas normal, créée par POSTGRES_DB).
      - name: Sécurité — création de la base si absente
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres \
            -c "CREATE DATABASE tomatoscan_test;" 2>/dev/null || true

      # Étape 6bis — Applique les migrations Alembic contre le service PostgreSQL réel
      # ci-dessus, pour que les tables existent avant que pytest ne s'exécute — et pour
      # vérifier, à chaque run de CI, que les migrations s'appliquent bien sur un vrai
      # PostgreSQL (pas seulement sur SQLite en local).
      - name: Migrations BDD (alembic upgrade head)
        run: uv run alembic upgrade head

      # Étape 7 — Exécution de la suite complète (API + modèle + frontend + BDD) avec couverture
      # Seuil appliqué : 75% sur src/tomatoscan/api/ (couverture réellement mesurée ~78%) —
      # --cov-fail-under fait effectivement échouer la CI en dessous, contrairement à un
      # commentaire d'objectif non appliqué.
      - name: Tests (pytest + couverture)
        run: uv run pytest tests/ -v --cov=src/tomatoscan/api --cov-report=term-missing --cov-fail-under=75

      # Étape 7bis — Seuil de couverture dédié au modèle (C12 — "les tests respectent la
      # couverture souhaitée établie"). Étape séparée de l'étape 7 : --cov-fail-under
      # s'applique à l'ensemble des --cov donnés à une même invocation pytest, donc un
      # seuil par composant (75% API, 80% modèle appliqués) demande deux invocations
      # distinctes plutôt qu'un seuil combiné qui ne voudrait rien dire pris isolément
      # pour l'un ou l'autre. Seuil de 80% appliqué, sous la couverture réellement
      # mesurée (~85%).
      - name: Couverture du modèle (seuil dédié)
        run: uv run pytest tests/test_model/ --cov=src/tomatoscan/model --cov-report=term-missing --cov-fail-under=80

      # Étape 8 — Build Docker de validation (API + frontend), sans push ni registre.
      # S'exécute sur chaque push ET chaque PR : prouve que les deux Dockerfile restent
      # valides avant tout merge — sans ça, une image cassée ne serait détectée qu'au
      # moment de la livraison (job "livraison") ou du build Coolify. La livraison réelle
      # des images vers ghcr.io est faite par le job "livraison" ci-dessous, uniquement
      # après succès de ce job "test" et uniquement sur push develop/main.
      - name: Build Docker de validation (API + frontend, sans push)
        run: |
          docker build -f Dockerfile.api -t tomatoscan-api:ci .
          docker build -f Dockerfile.front -t tomatoscan-front:ci .

  # ---------------------------------------------------------------------------
  # Job de LIVRAISON applicative (compétence C19) — conditionné au succès des tests.
  #
  # Ne s'exécute que si :
  #   - le job "test" ci-dessus est vert (needs: test), ET
  #   - l'événement est un push (pas une pull_request), ET
  #   - la branche est develop ou main.
  # Aucune image n'est donc jamais publiée depuis une PR ni depuis du code non testé.
  #
  # Construit et pousse les images API et frontend sur GitHub Container Registry
  # (ghcr.io), taguées par le SHA du commit (traçabilité exacte commit → image) et par
  # le nom de branche (develop/main) pour retrouver facilement la dernière image d'un
  # environnement. Coolify reste la cible de déploiement finale sur le VPS (voir
  # docs/cd_application.md) : ces images sont l'artefact de livraison versionné et testé.
  # ---------------------------------------------------------------------------
  livraison:
    name: Livraison — build & push des images vers ghcr.io
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Autorise le GITHUB_TOKEN intégré au run à écrire des packages (images) sur ghcr.io.
    # Aucun secret supplémentaire à créer : GITHUB_TOKEN est fourni automatiquement.
    permissions:
      contents: read
      packages: write

    steps:
      # Étape 1 — Récupération du code source (Dockerfile.api, Dockerfile.front, sources)
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 — Authentification auprès de ghcr.io avec le token intégré au run.
      # github.actor = compte qui a déclenché le run ; le token porte la permission
      # packages: write déclarée ci-dessus.
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étape 3 — Build + push de l'image API. Deux tags :
      #   - :${{ github.sha }}      → image immuable, traçable au commit exact
      #   - :${{ github.ref_name }} → alias mobile de la dernière image de la branche
      #                               (develop ou main)
      # Les noms d'images ghcr.io doivent être en minuscules : le dépôt sulivan-moreau
      # l'est déjà, aucun risque de casse ici.
      - name: Build & push image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/sulivan-moreau/tomatoscan-api:${{ github.sha }}
            ghcr.io/sulivan-moreau/tomatoscan-api:${{ github.ref_name }}

      # Étape 4 — Build + push de l'image frontend (mêmes conventions de tags)
      - name: Build & push image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.front
          push: true
          tags: |
            ghcr.io/sulivan-moreau/tomatoscan-front:${{ github.sha }}
            ghcr.io/sulivan-moreau/tomatoscan-front:${{ github.ref_name }}

      # Étape 5 — Résumé de livraison dans l'onglet Summary du run (images publiées).
      - name: Résumé de la livraison
        if: always()
        run: |
          {
            echo "## Livraison des images vers ghcr.io"
            echo ""
            echo "| Image | Tags poussés |"
            echo "|---|---|"
            echo "| API | \`${{ github.sha }}\`, \`${{ github.ref_name }}\` |"
            echo "| Frontend | \`${{ github.sha }}\`, \`${{ github.ref_name }}\` |"
            echo ""
            echo "Registre : \`ghcr.io/sulivan-moreau/tomatoscan-{api,front}\`"
            echo "Déploiement final sur le VPS assuré par Coolify (voir docs/cd_application.md)."
          } >> "$GITHUB_STEP_SUMMARY"

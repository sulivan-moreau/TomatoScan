# Docker Compose — surcouche de démonstration locale (bac à sable)
#
# Rôle : publier vers l'hôte les ports de Prometheus et Grafana, qui ne le sont
# jamais dans docker-compose.yml. En préprod et en production (Coolify sur le VPS
# OVH), ces deux services restent volontairement joignables uniquement depuis le
# réseau Docker interne "coolify" — les exposer publiquement offrirait un accès
# non authentifié aux métriques (Prometheus n'a aucune authentification) et une
# surface d'attaque supplémentaire sur l'interface Grafana.
#
# Ce fichier n'est JAMAIS chargé en préprod ni en production : Coolify utilise
# docker-compose.yml (+ docker-compose.override.yml sur develop) et ignore
# celui-ci, qui doit être demandé explicitement avec -f.
#
# Utilisation (le réseau externe "coolify" doit exister au préalable :
# "docker network create coolify") :
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Note : passer -f désactive le chargement automatique de
# docker-compose.override.yml (préprod). Pour reproduire la préprod en local,
# l'ajouter explicitement :
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.local.yml up
#
# Accès obtenus :
#   - Prometheus : http://localhost:9090
#   - Grafana    : http://localhost:3000 (admin / $GRAFANA_PASSWORD)

services:

  # ─── Prometheus exposé sur l'hôte (démonstration locale uniquement) ──────────
  prometheus:
    ports:
      - "9090:9090"

  # ─── Grafana exposé sur l'hôte (démonstration locale uniquement) ─────────────
  grafana:
    ports:
      - "3000:3000"
